server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Papers can be large and agent answers can take a few minutes.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The PDF.js worker is an ES module (.mjs). Browsers refuse to run it unless
    # it is served as JavaScript, and nginx's default MIME list may not map .mjs.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    # Single-page app: send unknown paths to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
